name: Release

# Publishes the scoped package to NPM via semantic-release using npm trusted
# publishing (OIDC). No NPM_TOKEN secret is involved: GitHub mints a short-lived
# OIDC token for this job and npm exchanges it for publish rights.
#
# The release runs automatically once CI has passed on main, and can still be run by
# hand from the Actions tab. It deliberately does NOT trigger on push: CI and this
# workflow would then run concurrently, and this job would publish an immutable npm
# version before CI could report a failure — this job only builds, it does not lint,
# typecheck, test or audit. Gating on `workflow_run` means the full CI matrix
# (3 OS x 2 node, plus the production-dependency audit) has already gone green on the
# same commit.
#
# No release loop is possible: the release commit semantic-release pushes carries
# [skip ci] (see .releaserc.json), so it starts no CI run and therefore no release run.
# A push whose commits are all chore/docs/ci simply ends with "no release necessary".
#
# Preconditions configured on npmjs.com for @webapper/cloudsee-drive-mcp
# (Settings -> Trusted Publisher). Every field is case-sensitive and must match exactly:
#   Publisher          GitHub Actions
#   Organization       webapper-services
#   Repository         cloudsee-drive-mcp
#   Workflow filename  release.yml   <-- the name of THIS file, including the extension
#   Allowed actions    Allow npm publish
#
# OIDC cannot publish a package's very first version, because npm requires the package
# to exist before its trusted-publisher settings can be edited. The package is already on
# the registry, so that limitation does not apply here.

on:
  workflow_run:
    workflows: ["CI"] # must match `name:` in ci.yml exactly
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # @semantic-release/git commits CHANGELOG/package.json back to main
  issues: write
  pull-requests: write
  id-token: write # required — without it GitHub mints no OIDC token and npm falls back to asking for a token

jobs:
  release:
    runs-on: ubuntu-latest
    # Manual runs always proceed. Automatic runs proceed only when the CI run that
    # triggered them succeeded — `workflow_run` fires on completion, failure included.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # semantic-release 25 requires node ^22.14.0 || >=24.10.0; both current LTS
          # lines satisfy that. The published package's own floor stays node >=20
          # (package.json engines) — this only governs the release job.
          node-version: lts/*
          cache: npm
          # Deliberately NO registry-url. setup-node would write an .npmrc containing an
          # _authToken placeholder, and semantic-release must own npm authentication for
          # OIDC to be used at all. This is an explicit warning in semantic-release's
          # GitHub Actions recipe, not a preference.
      - name: Ensure the npm CLI supports trusted publishing
        # Trusted publishing needs npm CLI >= 11.5.1. Pinned as a floor, not an exact
        # version, so patch releases still land.
        run: npm install -g "npm@^11.5.1"
      - run: npm ci
      - run: npm run build
      - name: Semantic Release
        env:
          # GITHUB_TOKEN only — used for the release commit, the git tag and the GitHub
          # release. npm auth comes from the OIDC token, so no NPM_TOKEN is set.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
